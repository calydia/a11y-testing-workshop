<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Travel information for the open day</title>
  <desc id="description">A tram, a dotted route to the community centre, and travel information.</desc>
  <rect width="960" height="540" fill="#f5f0ff"/>
  <rect width="960" height="96" fill="#15074d"/>
  <text x="54" y="63" fill="#fff" font-family="Arial, sans-serif" font-size="36" font-weight="700">Riverside Community Centre</text>
  <text x="54" y="180" fill="#24175c" font-family="Arial, sans-serif" font-size="54" font-weight="700">Travel to the open day</text>
  <text x="54" y="250" fill="#38325c" font-family="Arial, sans-serif" font-size="32">Tram 7 · Riverside Square</text>
  <rect x="54" y="305" width="852" height="150" rx="8" fill="#fff" stroke="#7147b8" stroke-width="5"/>
  <text x="88" y="365" fill="#24175c" font-family="Arial, sans-serif" font-size="31" font-weight="700">Shuttle cancelled after 16:00</text>
